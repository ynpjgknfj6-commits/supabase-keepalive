name: Supabase keepalive

# Free Supabase projects pause after 7 days without activity.
# This pings the database every 3 days so the F1 Fantasy project stays awake.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keepalive.yml"]

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://aftqqefagxvhulhfcyhg.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TABLES: leagues league_members profiles teams fantasy_teams picks predictions races drivers users
    steps:
      - name: Ping Supabase database
        run: |
          set -u
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY is not set"; exit 1
          fi
          auth=(-H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")

          # Read one row from the first table that exists. A 200 (even an
          # empty list under RLS) means Postgres ran a real query.
          ok=""
          for table in $TABLES; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 "${auth[@]}" "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" || echo 000)
            echo "Table $table: HTTP $code $(head -c 200 body.json 2>/dev/null)"
            if [ "$code" = "200" ]; then ok="$table"; break; fi
          done

          if [ -z "$ok" ]; then
            echo "::error::No table answered with HTTP 200. The project may be paused (restore it in the Supabase dashboard), or TABLES needs a real table name."
            exit 1
          fi
          echo "Database is awake (queried $ok)."

      - name: Record ping (keeps the scheduled workflow from being disabled)
        uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-ping.txt
          git commit -m "Keepalive ping" && git push || echo "Nothing to commit"
